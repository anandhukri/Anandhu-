
<!--<div style="border: 2px;" [ngStyle]="{'background-color' : !movie1 || movie1.productionCompany ? 'pink' : 'teal'}">-->
<div style="border: 2px;" [ngStyle]="{'background-color' : !movie1 || movie1.id ? 'pink' : 'teal'}">
  <div style="border: 2px;" [ngStyle]="{'background-color' : !movie1 || movie1.director ? 'pink' : 'teal'}">
    <div style="border: 2px;" [ngStyle]="{'background-color' : (!movie1 || movie1.alreadyWatched) ? 'pink' : 'teal'}">
      <div style="border: 2px;" [ngStyle]="{'background-color' : !movie1 || movie1.name ? 'pink' : 'teal'}">
        <div style="border: 2px;" [ngStyle]="{'background-color' : !movie1 || +movie1.year % 2 === 0 ? 'pink' : 'teal'}">

<!--          <h1>{{movie1?.name}}</h1>-->
<!--          <img src="/Users/macbookananduhu/PhpstormProjects/Anandhu-NEW/src/app/images/movieimage.jpeg" alt="">-->
<!--          <p>Id: {{movie1?.id}}</p>-->
<!--          <p>Already watched: {{movie1?.alreadyWatched ? 'Yes' : 'No'}}</p>-->
<!--          <p>Director: {{movie1?.director}}</p>-->
<!--          <p>Year Released: {{movie1?.year}}</p>-->

          <div *ngIf="movie1">
            <h3>{{ movie1.name }}</h3>
            <img [src]="movie1?.image" [width]="imageWidth" [height]="imageHeight">
            <p>Director: {{ movie1.director }}</p>
            <p>Year: {{ movie1.year }}</p>
            <p>Already Watched: {{ movie1.alreadyWatched ? 'Yes' : 'No' }}</p>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
