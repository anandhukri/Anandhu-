<mat-card *ngIf="movie1">
  <mat-card-header>
    <mat-card-title>{{ movie1.name }} ({{ movie1.year }})</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ movie1 | fullMovieDetails }}</p>
    <p>Release Date: {{ movie1.releaseDate | date:'fullDate' }}</p>
    <p>Genre: {{ movie1.genre | uppercase }}</p>
    <p>Budget: {{ movie1.budget | currency:'USD':'symbol' }}</p>
    <img mat-card-image [src]="movie1.image" [alt]="movie1.name" [width]="movie1.imageWidth" [height]="movie1.imageHeight" />
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="accent" (click)="editMovie(movie1.id)" matTooltip="Edit movie details">Edit</button>
    <button mat-raised-button color="warn" (click)="deleteMovie(movie1.id)" matTooltip="Delete movie">Delete</button>
  </mat-card-actions>
</mat-card>
